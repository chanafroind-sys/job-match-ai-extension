# Daily Matches report: the last days of decks and the job pool, in numbers
# (server-python/scripts/dm_report.py). Read-only, and aggregates only (no
# person, CV or job title), since this repository's run logs are public.
# Lets the decks be checked from GitHub without the web service's logs.
name: Daily Matches report

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back"
        default: "3"
  schedule:
    - cron: "17 12 * * *"  # after the morning pipeline, most days

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server-python/requirements.txt
      - name: Install dependencies
        working-directory: server-python
        run: pip install -r requirements.txt
      - name: Report
        working-directory: server-python
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/dm_report.py --days "${{ inputs.days || '3' }}"
